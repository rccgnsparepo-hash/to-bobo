name: Android Debug APK & GitHub Release

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify Node.js version
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          node -e "const major = parseInt(process.versions.node.split('.')[0], 10); if (major < 22) throw new Error('Capacitor 8 CLI requires Node.js >= 22.0.0');"

      - name: Setup Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          node -v
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Release Artifacts
        run: |
          mkdir -p release-assets
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "android/app/build/outputs/apk/debug/app-debug.apk" "release-assets/flick-v1.0.${{ github.run_number }}-debug.apk"
            cp "android/app/build/outputs/apk/debug/app-debug.apk" "release-assets/flick-app-latest.apk"
          fi
          ls -la release-assets/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Flick Release {0}', github.ref_name) || format('Flick Android APK v1.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
